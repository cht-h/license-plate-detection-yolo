version: '3.8'

services:
  license-plate-detector:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      # Mount for video files
      - ../data:/app/data
      # Mount for model weights
      - ../models:/app/models
    environment:
      - CUDA_VISIBLE_DEVICES=  # Disable GPU by default
    # For GPU support, uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    command: >
      --mode video
      --input /app/data/raw/sample_video.mp4
      --output /app/data/outputs/detected.mp4